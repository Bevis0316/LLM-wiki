<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 畫面是怎麼畫出來的？｜LLM Wiki 教學簡報</title>
  <style>
    :root {
      --bg: #050507;
      --surface: #0f1116;
      --surface-2: #161922;
      --border: #252a36;
      --text: #eef1f6;
      --muted: #98a2b3;
      --accent: #38bdf8;
      --accent-2: #a78bfa;
      --ok: #34d399;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Progress Bar */
    .progress-track {
      height: 3px;
      background: #141720;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      width: 0%;
      transition: width 0.25s ease;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 5, 7, 0.92);
      font-size: 13px;
      color: var(--muted);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Stage */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 36px;
      overflow-y: auto;
    }

    .slide-card {
      width: 100%;
      max-width: 1120px;
      min-height: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 36px 44px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .slide-tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    h1 {
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    /* Layouts */
    .split-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 28px;
      align-items: stretch;
    }
    @media (max-width: 860px) {
      .split-grid { grid-template-columns: 1fr; }
      .slide-card { padding: 24px; }
    }

    .analogy-box {
      background: rgba(56, 189, 248, 0.08);
      border-left: 3px solid var(--accent);
      padding: 12px 16px;
      border-radius: 0 8px 8px 0;
      font-size: 14px;
      line-height: 1.6;
      color: #dbeafe;
      margin-bottom: 18px;
    }

    ul.bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    ul.bullet-list li {
      position: relative;
      padding-left: 20px;
      font-size: 15px;
      line-height: 1.65;
      color: #dde3ec;
    }
    ul.bullet-list li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    /* Cards Layout */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    @media (max-width: 860px) {
      .cards-grid { grid-template-columns: 1fr; }
    }
    .info-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }
    .info-card h3 {
      font-size: 16px;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .info-card p {
      font-size: 14px;
      line-height: 1.65;
      color: #d4dae3;
    }

    /* Table Layout */
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
      line-height: 1.5;
    }
    th {
      background: var(--surface-2);
      color: var(--accent);
      font-weight: 600;
    }
    tr:nth-child(even) td { background: rgba(255, 255, 255, 0.015); }

    /* Demo Panel */
    .demo-panel {
      background: #08090d;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .demo-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .demo-canvas {
      width: 100%;
      height: 250px;
      background: #030406;
      border-radius: 6px;
      border: 1px solid #1c202b;
      display: block;
    }
    .pipeline-steps {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pipeline-steps button.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.16);
      color: #fff;
    }

    /* Footer */
    .slide-footer {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .sources-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .source-badge {
      background: rgba(167, 139, 250, 0.12);
      color: #d8b4fe;
      border: 1px solid rgba(167, 139, 250, 0.35);
      padding: 3px 8px;
      border-radius: 999px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Overview Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 100%;
      max-width: 780px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }
    .overview-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
    }
    .overview-item.current { border-color: var(--accent); }
    .overview-item small { color: var(--accent); display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <header>
    <div class="brand">
      <span class="brand-dot"></span>
      <span id="deckTitle">LLM Wiki 教學簡報</span>
    </div>
    <div class="header-actions">
      <span id="slideCounter">1 / 1</span>
      <button id="overviewBtn" title="快捷鍵 G">總覽 (G)</button>
    </div>
  </header>

  <main>
    <section class="slide-card" id="slideCard"></section>
  </main>

  <div class="modal-backdrop" id="overviewModal">
    <div class="modal-box">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3>投影片總覽</h3>
        <button id="closeOverviewBtn">關閉 (Esc)</button>
      </div>
      <div class="overview-grid" id="overviewGrid"></div>
    </div>
  </div>

  <script src="slides-data.js"></script>
  <script>
    const data = window.SLIDES_DATA;
    const slides = data.slides;
    let currentIndex = 0;
    let activeCleanup = null;

    const slideCard = document.getElementById("slideCard");
    const slideCounter = document.getElementById("slideCounter");
    const progressFill = document.getElementById("progressFill");
    const deckTitle = document.getElementById("deckTitle");
    const overviewModal = document.getElementById("overviewModal");
    const overviewGrid = document.getElementById("overviewGrid");

    deckTitle.textContent = `${data.meta.title} — ${data.meta.version}`;

    function renderSlide(index) {
      if (activeCleanup) {
        activeCleanup();
        activeCleanup = null;
      }

      currentIndex = Math.max(0, Math.min(slides.length - 1, index));
      const s = slides[currentIndex];

      slideCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
      progressFill.style.width = `${((currentIndex + 1) / slides.length) * 100}%`;

      let bodyHtml = "";

      if (s.layout === "split") {
        bodyHtml = `
          <div class="split-grid">
            <div>
              ${s.analogy ? `<div class="analogy-box">${s.analogy}</div>` : ""}
              <ul class="bullet-list">${(s.bullets || []).map(b => `<li>${b}</li>`).join("")}</ul>
            </div>
            <div class="demo-panel" id="demoPanel"></div>
          </div>
        `;
      } else if (s.layout === "table" && s.table) {
        bodyHtml = `
          <div class="table-wrap">
            <table>
              <thead><tr>${s.table.headers.map(h => `<th>${h}</th>`).join("")}</tr></thead>
              <tbody>
                ${s.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (s.layout === "cards" && s.cards) {
        bodyHtml = `
          <div class="cards-grid">
            ${s.cards.map(c => `
              <div class="info-card">
                <h3>${c.heading}</h3>
                <p>${c.body}</p>
              </div>
            `).join("")}
          </div>
        `;
      } else {
        bodyHtml = `
          <div>
            <ul class="bullet-list">${(s.bullets || []).map(b => `<li>${b}</li>`).join("")}</ul>
          </div>
        `;
      }

      const sourceBadges = (s.sources || []).map(src =>
        `<span class="source-badge">[[${src}]]</span>`
      ).join("");

      slideCard.innerHTML = `
        <div>
          <span class="slide-tag">${s.tag}</span>
          <h1>${s.title}</h1>
          <p class="subtitle">${s.subtitle || ""}</p>
          ${bodyHtml}
        </div>
        <div class="slide-footer">
          <div class="sources-wrap">
            <span>Wiki 來源追溯：</span>
            ${sourceBadges}
          </div>
          <div class="nav-controls">
            <button id="prevBtn" ${currentIndex === 0 ? "disabled" : ""}>← 上一頁</button>
            <button id="nextBtn" ${currentIndex === slides.length - 1 ? "disabled" : ""}>下一頁 →</button>
          </div>
        </div>
      `;

      document.getElementById("prevBtn").onclick = () => renderSlide(currentIndex - 1);
      document.getElementById("nextBtn").onclick = () => renderSlide(currentIndex + 1);

      if (s.demo) {
        mountDemo(s.demo, document.getElementById("demoPanel"));
      }
    }

    function mountDemo(type, container) {
      if (!container) return;

      if (type === "gpu") {
        container.innerHTML = `
          <div class="demo-header">
            <span>互動模擬：CPU 序列繪製 vs GPU 平行繪製</span>
            <button id="gpuRunBtn">重新模擬</button>
          </div>
          <canvas class="demo-canvas" id="gpuCanvas" width="440" height="250"></canvas>
        `;
        const canvas = document.getElementById("gpuCanvas");
        const ctx = canvas.getContext("2d");
        let rafId = null;
        let cpuIdx = 0;
        let gpuIdx = 0;
        const cols = 16, rows = 12, total = cols * rows;

        function reset() {
          cpuIdx = 0;
          gpuIdx = 0;
          if (rafId) cancelAnimationFrame(rafId);
          loop();
        }

        function drawGrid(ox, oy, count, color, label) {
          ctx.fillStyle = "#98a2b3";
          ctx.font = "12px sans-serif";
          ctx.fillText(label, ox, oy - 8);
          const size = 10, gap = 2;
          for (let i = 0; i < total; i++) {
            const c = i % cols, r = Math.floor(i / cols);
            ctx.fillStyle = i < count ? color : "#151923";
            ctx.fillRect(ox + c * (size + gap), oy + r * (size + gap), size, size);
          }
        }

        function loop() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          if (cpuIdx < total) cpuIdx += 1;
          if (gpuIdx < total) gpuIdx = Math.min(total, gpuIdx + 16);
          drawGrid(18, 36, cpuIdx, "#fbbf24", `CPU (少量核心序列處理): ${Math.round(cpuIdx / total * 100)}%`);
          drawGrid(232, 36, gpuIdx, "#38bdf8", `GPU (多核心平行處理): ${Math.round(gpuIdx / total * 100)}%`);
          if (cpuIdx < total || gpuIdx < total) {
            rafId = requestAnimationFrame(loop);
          }
        }

        document.getElementById("gpuRunBtn").onclick = reset;
        reset();
        activeCleanup = () => rafId && cancelAnimationFrame(rafId);
      }

      if (type === "pipeline") {
        const stages = ["1. 頂點座標", "2. 圖元裝配", "3. 光柵化", "4. 片段著色"];
        let stage = 0;
        container.innerHTML = `
          <div class="demo-header"><span>互動管線：點擊切換渲染階段</span></div>
          <div class="pipeline-steps" id="pipeBtns"></div>
          <canvas class="demo-canvas" id="pipeCanvas" width="440" height="210"></canvas>
        `;
        const btns = document.getElementById("pipeBtns");
        const canvas = document.getElementById("pipeCanvas");
        const ctx = canvas.getContext("2d");

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const pts = [{ x: 220, y: 30 }, { x: 110, y: 180 }, { x: 330, y: 180 }];
          const cell = 14;

          if (stage >= 2) {
            for (let y = 20; y < 195; y += cell) {
              for (let x = 90; x < 350; x += cell) {
                if (pointInTri(x + cell / 2, y + cell / 2, pts[0], pts[1], pts[2])) {
                  if (stage === 2) {
                    ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
                    ctx.strokeStyle = "#1e293b";
                    ctx.fillRect(x, y, cell - 1, cell - 1);
                  } else {
                    const t = (y - 30) / 150;
                    const r = Math.round(56 + t * 140);
                    const g = Math.round(189 - t * 60);
                    const b = 248;
                    ctx.fillStyle = `rgb(${r},${g},${b})`;
                    ctx.fillRect(x, y, cell - 1, cell - 1);
                  }
                }
              }
            }
          }

          if (stage >= 1) {
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            ctx.lineTo(pts[1].x, pts[1].y);
            ctx.lineTo(pts[2].x, pts[2].y);
            ctx.closePath();
            ctx.strokeStyle = stage === 1 ? "#38bdf8" : "rgba(255,255,255,0.45)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }

          pts.forEach((p, idx) => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#fbbf24";
            ctx.fill();
            ctx.fillStyle = "#e2e8f0";
            ctx.font = "11px monospace";
            ctx.fillText(`V${idx + 1}`, p.x + 8, p.y + 4);
          });
        }

        function pointInTri(px, py, a, b, c) {
          const area = (p1, p2, p3) => (p1.x - p3.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p3.y);
          const d1 = area({ x: px, y: py }, a, b);
          const d2 = area({ x: px, y: py }, b, c);
          const d3 = area({ x: px, y: py }, c, a);
          const hasNeg = (d1 < 0) || (d2 < 0) || (d3 < 0);
          const hasPos = (d1 > 0) || (d2 > 0) || (d3 > 0);
          return !(hasNeg && hasPos);
        }

        function renderBtns() {
          btns.innerHTML = stages.map((st, i) =>
            `<button class="${i === stage ? "active" : ""}" data-i="${i}">${st}</button>`
          ).join("");
          btns.querySelectorAll("button").forEach(b => {
            b.onclick = () => { stage = Number(b.dataset.i); renderBtns(); draw(); };
          });
        }
        renderBtns();
        draw();
      }

      if (type === "sdf") {
        container.innerHTML = `
          <div class="demo-header"><span>互動 2D SDF：移動滑鼠改變光線方向（Sphere Tracing）</span></div>
          <canvas class="demo-canvas" id="sdfCanvas" width="440" height="250"></canvas>
        `;
        const canvas = document.getElementById("sdfCanvas");
        const ctx = canvas.getContext("2d");
        const obs = [
          { x: 250, y: 120, r: 42 },
          { x: 350, y: 185, r: 34 },
          { x: 330, y: 60, r: 26 }
        ];
        const origin = { x: 45, y: 125 };
        let target = { x: 250, y: 120 };

        function sdf(px, py) {
          return Math.min(...obs.map(o => Math.hypot(px - o.x, py - o.y) - o.r));
        }

        function draw() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          obs.forEach(o => {
            ctx.beginPath();
            ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(167, 139, 250, 0.2)";
            ctx.fill();
            ctx.strokeStyle = "#a78bfa";
            ctx.lineWidth = 2;
            ctx.stroke();
          });

          const ang = Math.atan2(target.y - origin.y, target.x - origin.x);
          const dx = Math.cos(ang), dy = Math.sin(ang);
          let cx = origin.x, cy = origin.y;

          for (let step = 0; step < 12; step++) {
            const d = sdf(cx, cy);
            if (d < 1.5 || cx > 440 || cy < 0 || cy > 250) break;
            ctx.beginPath();
            ctx.arc(cx, cy, d, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(56, 189, 248, 0.35)";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fillStyle = "#38bdf8";
            ctx.fill();

            const nx = cx + dx * d, ny = cy + dy * d;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(nx, ny);
            ctx.strokeStyle = "#38bdf8";
            ctx.stroke();
            cx = nx; cy = ny;
          }

          ctx.beginPath();
          ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = "#34d399";
          ctx.fill();
        }

        const onMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          target = {
            x: (e.clientX - rect.left) * (canvas.width / rect.width),
            y: (e.clientY - rect.top) * (canvas.height / rect.height)
          };
          draw();
        };
        canvas.addEventListener("mousemove", onMove);
        draw();
        activeCleanup = () => canvas.removeEventListener("mousemove", onMove);
      }

      if (type === "gs3d") {
        container.innerHTML = `
          <div class="demo-header">
            <span>互動示意：2D 高斯橢球潑濺與半透明疊加</span>
            <button id="gsShuffleBtn">重新撒點</button>
          </div>
          <canvas class="demo-canvas" id="gsCanvas" width="440" height="250"></canvas>
        `;
        const canvas = document.getElementById("gsCanvas");
        const ctx = canvas.getContext("2d");

        function drawSplats() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const count = 48;
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const rad = 58 + (Math.random() - 0.5) * 28;
            const x = 220 + Math.cos(angle) * rad * 1.4;
            const y = 125 + Math.sin(angle) * rad * 0.9;
            const rx = 18 + Math.random() * 24;
            const ry = 8 + Math.random() * 14;
            const rot = Math.random() * Math.PI;
            const hue = 190 + (i / count) * 100;

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rot);
            const grad = ctx.createRadialGradient(0, 0, 1, 0, 0, rx);
            grad.addColorStop(0, `hsla(${hue}, 85%, 65%, 0.55)`);
            grad.addColorStop(1, `hsla(${hue}, 85%, 65%, 0)`);
            ctx.scale(1, ry / rx);
            ctx.beginPath();
            ctx.arc(0, 0, rx, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
          }
        }
        document.getElementById("gsShuffleBtn").onclick = drawSplats;
        drawSplats();
      }
    }

    function openOverview() {
      overviewGrid.innerHTML = slides.map((s, i) => `
        <div class="overview-item ${i === currentIndex ? "current" : ""}" data-i="${i}">
          <small>${s.tag}</small>
          <div>${s.title}</div>
        </div>
      `).join("");
      overviewGrid.querySelectorAll(".overview-item").forEach(el => {
        el.onclick = () => {
          renderSlide(Number(el.dataset.i));
          overviewModal.classList.remove("open");
        };
      });
      overviewModal.classList.add("open");
    }

    document.getElementById("overviewBtn").onclick = openOverview;
    document.getElementById("closeOverviewBtn").onclick = () => overviewModal.classList.remove("open");

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") renderSlide(currentIndex + 1);
      if (e.key === "ArrowLeft") renderSlide(currentIndex - 1);
      if (e.key === "Home") renderSlide(0);
      if (e.key === "End") renderSlide(slides.length - 1);
      if (e.key === "g" || e.key === "G") openOverview();
      if (e.key === "Escape") overviewModal.classList.remove("open");
    });

    renderSlide(0);
  </script>
</body>
</html>
